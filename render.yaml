services:
  - type: web
    name: sms-app
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn SMS.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
