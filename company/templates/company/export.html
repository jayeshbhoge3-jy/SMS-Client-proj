{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% trans "Export Data" %}</title>
    <link rel="icon" type="image/png" href="{% static 'accounts/images/Tab Logo.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-lg bg-white rounded-2xl shadow-lg p-6 text-center">
        <h2 class="text-xl font-bold text-slate-800 mb-4">{% trans "Export Data" %}</h2>

        <p class="text-sm text-slate-600 mb-6">
            Click below to export company data.
        </p>
<form method="GET" action="{% url 'export_data_download' %}">
    <button type="submit" class="px-6 py-3 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">
        Export Excel
    </button>
</form>

        <div class="mt-4">
            <a href="{% url 'company_dashboard' %}" class="text-sm text-slate-500 hover:underline">{% trans "Back to Dashboard" %}</a>
        </div>
    </div>





<!-- BEGIN STARTER RESTRICTIONS -->
{% if company.plan_type == 'STARTER' %}
    <style>
        @media screen {
            .starter-watermark-global {
                display: none !important;
            }
        }
        @media print {
            .starter-watermark-global {
                display: block !important;
                position: fixed !important;
                top: 50% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) rotate(-45deg) !important;
                font-size: 48px !important;
                color: rgba(100, 116, 139, 0.15) !important;
                z-index: 999999 !important;
                pointer-events: none !important;
                white-space: nowrap !important;
                font-weight: bold !important;
                text-transform: uppercase !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
    <div class="starter-watermark-global">
        Powered by CWS Inventory
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const exportLinks = document.querySelectorAll('a[href*="export"], a[id*="exportPdfBtn"]');
            exportLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    Swal.fire({
                        icon: 'error',
                        title: 'Restricted Feature',
                        text: 'Upgrade to Business plan to use this feature.',
                        confirmButtonColor: '#4f46e5'
                    });
                });
            });
        });
    </script>
{% endif %}
<!-- END STARTER RESTRICTIONS -->

</body>

</html>
